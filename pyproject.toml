[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-eval-harness"
version = "0.0.0"
description = "Replay-driven policy evaluation harness skeleton."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12,<1.0",
  "PyYAML>=6.0,<7.0",
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<3.0",
  "pyarrow>=14.0,<20.0",
  "scikit-learn>=1.4,<2.0",
]

[project.scripts]
policy-eval = "policy_eval_harness.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
